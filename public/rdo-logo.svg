<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="rdoSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="rdoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rdoGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="rdoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f2a5c" />
    </linearGradient>
    <filter id="rdoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Solid Clean White Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- CIRCULAR EMBLEM -->
  <g id="mainEmblem">
    <!-- Outer Rings -->
    <circle cx="250" cy="200" r="172" fill="#ffffff" stroke="#15803d" stroke-width="6" />
    <circle cx="250" cy="200" r="163" fill="url(#rdoSky)" stroke="#0a2540" stroke-width="4" />

    <!-- Office Building in Background -->
    <g id="officeBuilding" opacity="0.95">
      <!-- Main roof & walls -->
      <rect x="150" y="115" width="200" height="95" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Left & Right wings -->
      <rect x="125" y="130" width="45" height="80" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
      <rect x="330" y="130" width="45" height="80" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Roof cornices -->
      <rect x="120" y="125" width="55" height="7" fill="#1e3a8a" rx="1" />
      <rect x="325" y="125" width="55" height="7" fill="#1e3a8a" rx="1" />
      <rect x="145" y="108" width="210" height="9" fill="#1e3a8a" rx="2" />
      <!-- Windows -->
      <rect x="135" y="142" width="25" height="25" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
      <rect x="340" y="142" width="25" height="25" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
      <!-- Pillars & Portico -->
      <rect x="195" y="140" width="110" height="70" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <rect x="225" y="160" width="50" height="50" fill="#0f172a" rx="2" />
      <line x1="205" y1="140" x2="205" y2="210" stroke="#64748b" stroke-width="4" />
      <line x1="295" y1="140" x2="295" y2="210" stroke="#64748b" stroke-width="4" />
    </g>

    <!-- Signboard: RDO OFFICE HUZURNAGAR -->
    <g id="topSignboard">
      <rect x="180" y="65" width="140" height="48" rx="6" fill="#091a32" stroke="#38bdf8" stroke-width="2" />
      <text x="250" y="86" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">RDO OFFICE</text>
      <text x="250" y="102" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="1">HUZURNAGAR</text>
    </g>

    <!-- Trees on Left -->
    <g id="trees">
      <path d="M120 185 Q115 150 135 140 Q155 130 165 155 Q180 170 170 195 Z" fill="#15803d" />
      <path d="M100 200 Q95 170 115 160 Q130 155 140 175 Q145 195 130 205 Z" fill="#22c55e" opacity="0.8" />
      <rect x="132" y="185" width="6" height="25" fill="#78350f" />
    </g>

    <!-- Rolling Green & Blue Landscape Waves in Circle Base -->
    <path d="M92 245 C150 215 220 235 280 215 C340 195 385 225 408 245 L408 360 C370 368 310 372 250 372 C190 372 130 368 92 360 Z" fill="#15803d" />
    <path d="M88 275 C160 240 240 265 310 240 C360 220 395 245 412 265 L412 372 C370 372 310 372 250 372 C190 372 130 372 88 372 Z" fill="#0284c7" opacity="0.85" />
    <path d="M95 295 C170 265 260 285 330 260 C380 240 405 265 412 280 L412 372 C370 372 310 372 250 372 C190 372 130 372 95 372 Z" fill="#b45309" opacity="0.75" />

    <!-- Center Desktop Computer Monitor -->
    <g id="desktopComputer" filter="url(#rdoShadow)">
      <!-- Monitor Stand -->
      <rect x="238" y="275" width="24" height="28" fill="#475569" />
      <ellipse cx="250" cy="303" rx="35" ry="6" fill="#1e293b" />
      <!-- Bezel -->
      <rect x="145" y="150" width="210" height="135" rx="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5" />
      <!-- Inner Screen -->
      <rect x="153" y="158" width="194" height="118" rx="4" fill="#ffffff" />
      
      <!-- Screen Left: Land Survey Cadastral Grid -->
      <g id="screenCadastre">
        <rect x="156" y="161" width="90" height="112" fill="#dcfce7" />
        <!-- Parcel boundary lines -->
        <path d="M156 195 L200 185 L205 225 L156 220 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" />
        <path d="M200 185 L246 190 L246 225 L205 225 Z" fill="#86efac" stroke="#16a34a" stroke-width="1.5" />
        <path d="M156 220 L205 225 L195 273 L156 273 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" />
        <path d="M205 225 L246 225 L246 273 L195 273 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
        <!-- Parcel survey numbers -->
        <text x="175" y="180" font-size="8" font-family="system-ui" font-weight="bold" fill="#166534">123</text>
        <text x="220" y="180" font-size="8" font-family="system-ui" font-weight="bold" fill="#166534">126</text>
        <text x="175" y="245" font-size="8" font-family="system-ui" font-weight="bold" fill="#166534">124</text>
        <text x="220" y="250" font-size="8" font-family="system-ui" font-weight="bold" fill="#166534">125</text>
        <!-- Blue Map Pin Marker -->
        <g transform="translate(195, 200)">
          <path d="M10 0 C4.5 0 0 4.5 0 10 C0 17 10 26 10 26 C10 26 20 17 20 10 C20 4.5 15.5 0 10 0 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
          <circle cx="10" cy="9" r="4" fill="#ffffff" />
        </g>
      </g>

      <!-- Screen Right: Checklist / File Record Rows -->
      <g id="screenChecklist" transform="translate(255, 166)">
        <!-- Row 1 -->
        <line x1="0" y1="12" x2="60" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <circle cx="75" cy="12" r="6" fill="#22c55e" />
        <path d="M72 12 L74 14 L78 10" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
        <!-- Row 2 -->
        <line x1="0" y1="30" x2="60" y2="30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <circle cx="75" cy="30" r="6" fill="#22c55e" />
        <path d="M72 30 L74 32 L78 28" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
        <!-- Row 3 -->
        <line x1="0" y1="48" x2="60" y2="48" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <circle cx="75" cy="48" r="6" fill="#22c55e" />
        <path d="M72 48 L74 50 L78 46" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
        <!-- Row 4 -->
        <line x1="0" y1="66" x2="60" y2="66" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <circle cx="75" cy="66" r="6" fill="#22c55e" />
        <path d="M72 66 L74 68 L78 64" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
        <!-- Row 5 -->
        <line x1="0" y1="84" x2="60" y2="84" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
        <circle cx="75" cy="84" r="6" fill="#22c55e" />
        <path d="M72 84 L74 86 L78 82" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
      </g>
    </g>

    <!-- Magnifying Glass on Left -->
    <g id="magnifier" transform="translate(60, 210) rotate(-25)">
      <!-- Handle -->
      <rect x="25" y="100" width="16" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <rect x="23" y="92" width="20" height="10" rx="2" fill="#94a3b8" />
      <!-- Glass Ring -->
      <circle cx="33" cy="50" r="42" fill="#ffffff" stroke="#0284c7" stroke-width="7" filter="url(#rdoShadow)" />
      <circle cx="33" cy="50" r="38" fill="#dcfce7" stroke="#38bdf8" stroke-width="2" />
      <!-- Inner magnified grid -->
      <path d="M10 50 L56 50 M33 15 L33 85" stroke="#16a34a" stroke-width="2" />
      <circle cx="33" cy="50" r="15" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 3" />
      <path d="M15 30 Q30 20 48 35" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
    </g>

    <!-- Stack of Office File Folders on Right -->
    <g id="fileStack" transform="translate(320, 160)" filter="url(#rdoShadow)">
      <!-- Bottom yellow folder -->
      <polygon points="0,95 80,75 105,100 25,120" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
      <!-- Orange folder -->
      <polygon points="0,85 80,65 105,90 25,110" fill="#f97316" stroke="#ea580c" stroke-width="1" />
      <!-- Blue folder -->
      <polygon points="0,75 80,55 105,80 25,100" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
      <!-- Top White File Binder -->
      <polygon points="0,65 80,45 105,70 25,90" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Top File Label: FILE DETAILS -->
      <g transform="translate(25, 45) rotate(-14)">
        <text x="25" y="16" font-family="system-ui" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">FILE</text>
        <text x="25" y="27" font-family="system-ui" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">DETAILS</text>
        <circle cx="50" cy="20" r="7" fill="#16a34a" />
        <path d="M47 20 L49 22 L54 17" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>
    </g>

    <!-- Flowing Base Crest Swirls -->
    <path d="M60 360 C 140 300, 360 300, 440 360 C 370 330, 130 330, 60 360 Z" fill="#0a2540" />
    <path d="M90 375 C 160 335, 340 335, 410 375 C 350 350, 150 350, 90 375 Z" fill="#15803d" />
  </g>

  <!-- TYPOGRAPHY: HUZURNAGAR FILE INFORMATION SYSTEM -->
  <g id="typographySection" transform="translate(250, 420)">
    <!-- Primary Title: HUZURNAGAR -->
    <text x="0" y="0" fill="#091a32" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="4">HUZURNAGAR</text>
    <!-- Subtitle: FILE INFORMATION SYSTEM -->
    <text x="0" y="24" fill="#15803d" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="2.5">FILE INFORMATION SYSTEM</text>
  </g>

  <!-- 4 BOTTOM FEATURE BADGES -->
  <g id="featureBadges" transform="translate(250, 475)">
    <!-- Dividing line above -->
    <line x1="-210" y1="-12" x2="210" y2="-12" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Badge 1: FILE DETAILS -->
    <g transform="translate(-165, 5)">
      <rect x="-12" y="-12" width="22" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <line x1="-7" y1="-5" x2="5" y2="-5" stroke="#166534" stroke-width="1.5" />
      <line x1="-7" y1="0" x2="5" y2="0" stroke="#166534" stroke-width="1.5" />
      <line x1="-7" y1="5" x2="1" y2="5" stroke="#166534" stroke-width="1.5" />
      <text x="18" y="-1" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">FILE</text>
      <text x="18" y="10" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">DETAILS</text>
    </g>

    <!-- Divider -->
    <line x1="-80" y1="-8" x2="-80" y2="18" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Badge 2: FILE STATUS -->
    <g transform="translate(-55, 5)">
      <path d="M-12 -8 L-5 -8 L-2 -5 L8 -5 C9 -5 10 -4 10 -3 L10 9 C10 10 9 11 8 11 L-12 11 C-13 11 -14 10 -14 9 L-14 -6 C-14 -7 -13 -8 -12 -8 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="17" y="-1" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">FILE</text>
      <text x="17" y="10" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">STATUS</text>
    </g>

    <!-- Divider -->
    <line x1="25" y1="-8" x2="25" y2="18" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Badge 3: EASY SEARCH -->
    <g transform="translate(50, 5)">
      <circle cx="-4" cy="0" r="7" fill="none" stroke="#0a2540" stroke-width="2" />
      <line x1="1" y1="5" x2="7" y2="11" stroke="#0a2540" stroke-width="2.5" stroke-linecap="round" />
      <text x="16" y="-1" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">EASY</text>
      <text x="16" y="10" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">SEARCH</text>
    </g>

    <!-- Divider -->
    <line x1="130" y1="-8" x2="130" y2="18" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Badge 4: SECURE & RELIABLE -->
    <g transform="translate(150, 5)">
      <path d="M-5 -10 L4 -10 C8 -10 9 -5 9 1 C9 6 4 11 -5 13 C-14 11 -19 6 -19 1 C-19 -5 -18 -10 -14 -10 Z" transform="translate(5,0)" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <path d="M-3 0 L-1 3 L5 -3" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="16" y="-1" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">SECURE</text>
      <text x="16" y="10" font-family="system-ui" font-size="9.5" font-weight="800" fill="#0f172a">&amp; RELIABLE</text>
    </g>
  </g>

  <!-- BOTTOM RIBBON BANNER -->
  <g id="bottomRibbon" transform="translate(250, 525)">
    <!-- Ribbon shape -->
    <polygon points="-210,0 -195,-12 195,-12 210,0 195,12 -195,12" fill="#091a32" stroke="#16a34a" stroke-width="2.5" />
    <polygon points="-210,0 -200,-10 -190,-10 -195,0 -190,10 -200,10" fill="#15803d" />
    <polygon points="210,0 200,-10 190,-10 195,0 190,10 200,10" fill="#15803d" />
    <!-- Ribbon Text -->
    <text x="0" y="4" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="900" text-anchor="middle" letter-spacing="2">
      —— RDO OFFICE, HUZURNAGAR ——
    </text>
  </g>
</svg>
