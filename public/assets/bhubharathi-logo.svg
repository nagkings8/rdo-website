<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bhuSunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="bhuSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="bhuFieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="bhuShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- CIRCLE EMBLEM -->
  <g id="circleEmblem">
    <!-- Outer Rings -->
    <circle cx="250" cy="200" r="172" fill="#ffffff" stroke="#15803d" stroke-width="7" />
    <circle cx="250" cy="200" r="164" fill="url(#bhuSky)" stroke="#16a34a" stroke-width="1.5" />

    <!-- TELANGANA STATE OUTLINE MAP -->
    <g id="telanganaMap" opacity="0.85">
      <path d="M230 75 
               C235 65, 255 60, 265 70 
               C275 80, 290 85, 305 95 
               C320 105, 325 125, 315 140 
               C325 155, 335 170, 330 190 
               C320 210, 295 225, 275 235 
               C255 245, 240 250, 230 240 
               C215 230, 205 210, 195 195 
               C185 180, 190 155, 195 140 
               C190 125, 205 100, 220 90 Z" 
            fill="#ffffff" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4 2" />
    </g>

    <!-- RISING GOLDEN SUN WITH RADIANT RAYS -->
    <g id="risingSun">
      <!-- 12 Radiating Sun Rays -->
      <g stroke="url(#bhuSunGrad)" stroke-width="3" opacity="0.85">
        <line x1="250" y1="175" x2="250" y2="105" stroke-width="4" />
        <line x1="250" y1="175" x2="215" y2="112" stroke-width="3.5" />
        <line x1="250" y1="175" x2="285" y2="112" stroke-width="3.5" />
        <line x1="250" y1="175" x2="185" y2="128" stroke-width="3.5" />
        <line x1="250" y1="175" x2="315" y2="128" stroke-width="3.5" />
        <line x1="250" y1="175" x2="162" y2="152" stroke-width="3.5" />
        <line x1="250" y1="175" x2="338" y2="152" stroke-width="3.5" />
        <line x1="250" y1="175" x2="150" y2="180" stroke-width="3" />
        <line x1="250" y1="175" x2="350" y2="180" stroke-width="3" />
      </g>
      <!-- Sun Disc -->
      <circle cx="250" cy="175" r="32" fill="url(#bhuSunGrad)" filter="url(#bhuShadow)" />
      <path d="M218 175 A32 32 0 0 1 282 175 Z" fill="#ea580c" opacity="0.3" />
    </g>

    <!-- ROLLING AGRICULTURAL HILLS & FURROWS -->
    <g id="hills">
      <!-- Far background hills -->
      <path d="M88 235 Q 170 190, 250 215 T 412 235 L 412 372 C 365 372 135 372 88 372 Z" fill="#86efac" opacity="0.7" />
      <!-- Midground green fields -->
      <path d="M84 255 Q 180 215, 270 245 T 416 250 L 416 372 C 365 372 135 372 84 372 Z" fill="url(#bhuFieldGrad)" />
      <!-- Soil furrow lines -->
      <path d="M90 285 C 160 260, 240 280, 330 260 C 370 250, 400 270, 416 285" stroke="#78350f" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M86 310 C 150 285, 230 305, 320 285 C 360 275, 395 295, 415 310" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5" />
    </g>

    <!-- GREEN SHADE TREE ON RIGHT -->
    <g id="greenTree" transform="translate(325, 140)">
      <!-- Trunk -->
      <path d="M28 65 Q 26 50, 28 35 Q 32 50, 36 65 Z" fill="#581c87" opacity="0.2" />
      <path d="M27 68 L 32 38 L 37 68 Z" fill="#78350f" />
      <!-- Foliage Canopy -->
      <circle cx="32" cy="30" r="24" fill="#15803d" />
      <circle cx="20" cy="34" r="18" fill="#16a34a" />
      <circle cx="44" cy="34" r="18" fill="#16a34a" />
      <circle cx="32" cy="18" r="18" fill="#22c55e" />
    </g>

    <!-- SILHOUETTE: FARMER PLOWING WITH PAIR OF BULLOCKS -->
    <g id="farmerAndBullocks" transform="translate(105, 150)" fill="#064e3b">
      <!-- Farmer in Dhoti with Staff -->
      <g id="farmer" transform="translate(5, 5)">
        <!-- Head / Turban -->
        <ellipse cx="14" cy="12" rx="4.5" ry="5.5" />
        <path d="M10 10 Q 14 5, 18 10 Z" fill="#022c22" />
        <!-- Torso & Arms -->
        <path d="M10 17 L 18 17 L 17 38 L 11 38 Z" />
        <!-- Staff in Hand -->
        <line x1="8" y1="8" x2="22" y2="40" stroke="#064e3b" stroke-width="2" stroke-linecap="round" />
        <!-- Walking Legs in Dhoti -->
        <path d="M11 38 L 7 58 L 11 58 L 14 42 L 17 58 L 21 58 L 17 38 Z" />
      </g>

      <!-- Connecting Plow Shaft / Rope -->
      <line x1="22" y1="36" x2="48" y2="38" stroke="#064e3b" stroke-width="2" />
      <path d="M48 38 L 44 54 L 40 54" stroke="#064e3b" stroke-width="2" fill="none" />

      <!-- Bullock / Ox 1 (Foreground) -->
      <g id="ox1" transform="translate(42, 12)">
        <!-- Body -->
        <ellipse cx="32" cy="24" rx="20" ry="12" />
        <!-- Hump -->
        <ellipse cx="20" cy="14" rx="6" ry="6" />
        <!-- Neck & Head -->
        <path d="M38 18 L 48 10 C 52 10, 54 14, 52 18 L 46 26 Z" />
        <!-- Horns -->
        <path d="M48 10 Q 52 2, 54 0" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M46 10 Q 48 4, 50 2" stroke="#064e3b" stroke-width="2" stroke-linecap="round" fill="none" />
        <!-- Legs -->
        <line x1="18" y1="32" x2="16" y2="52" stroke="#064e3b" stroke-width="3" stroke-linecap="round" />
        <line x1="24" y1="32" x2="23" y2="50" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
        <line x1="42" y1="32" x2="44" y2="52" stroke="#064e3b" stroke-width="3" stroke-linecap="round" />
        <line x1="48" y1="32" x2="50" y2="50" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
        <!-- Tail -->
        <path d="M12 20 Q 8 30, 10 40" stroke="#064e3b" stroke-width="1.5" fill="none" />
      </g>

      <!-- Second Bullock (Slightly behind) -->
      <g id="ox2" transform="translate(52, 6)" opacity="0.65">
        <ellipse cx="32" cy="24" rx="19" ry="11" />
        <ellipse cx="20" cy="14" rx="5" ry="5" />
        <path d="M38 18 L 48 10 C 52 10, 54 14, 52 18 L 46 26 Z" />
        <path d="M48 10 Q 52 2, 54 0" stroke="#064e3b" stroke-width="2" fill="none" />
        <line x1="18" y1="32" x2="17" y2="50" stroke="#064e3b" stroke-width="2.5" />
        <line x1="44" y1="32" x2="45" y2="50" stroke="#064e3b" stroke-width="2.5" />
      </g>
    </g>

    <!-- OPEN REVENUE BOOK (PAHANI / DHARANI REGISTER) IN FOREGROUND -->
    <g id="openBook" transform="translate(250, 280)" filter="url(#bhuShadow)">
      <!-- Book Binding / Spine Base -->
      <ellipse cx="0" cy="55" rx="14" ry="7" fill="#14532d" />
      
      <!-- Open Left Page Cover & Paper -->
      <path d="M 0 48 
               C -40 40, -90 44, -135 22 
               L -135 -40 
               C -90 -20, -40 -24, 0 -15 Z" 
            fill="#ffffff" stroke="#15803d" stroke-width="3" />
      
      <!-- Open Right Page Cover & Paper -->
      <path d="M 0 48 
               C 40 40, 90 44, 135 22 
               L 135 -40 
               C 90 -20, 40 -24, 0 -15 Z" 
            fill="#ffffff" stroke="#15803d" stroke-width="3" />

      <!-- Left Page Content: Cadastral Survey Land Parcels Map -->
      <g id="leftPageCadastre" transform="translate(-125, -28)">
        <rect x="5" y="5" width="105" height="52" fill="#dcfce7" rx="2" stroke="#86efac" stroke-width="1" />
        <!-- Cadastral boundaries -->
        <path d="M 10 10 L 45 15 L 40 40 L 10 35 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="1" />
        <path d="M 45 15 L 95 10 L 95 38 L 40 40 Z" fill="#86efac" stroke="#16a34a" stroke-width="1" />
        <path d="M 10 35 L 40 40 L 45 52 L 10 52 Z" fill="#86efac" stroke="#16a34a" stroke-width="1" />
        <path d="M 40 40 L 95 38 L 105 52 L 45 52 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="1" />
        <!-- Sub-divisions -->
        <line x1="68" y1="12" x2="68" y2="38" stroke="#15803d" stroke-width="0.8" stroke-dasharray="2 1" />
      </g>

      <!-- Right Page Content: Lion Capital & Ruled Ledger Lines -->
      <g id="rightPageLedger" transform="translate(15, -28)">
        <!-- Lion Capital of India Emblem -->
        <g id="lionCapital" transform="translate(50, 10)">
          <path d="M-8 -6 C-6 -10 6 -10 8 -6 C8 0 4 3 0 4 C-4 3 -8 0 -8 -6 Z" fill="#15803d" />
          <circle cx="-5" cy="-8" r="2.5" fill="#ca8a04" />
          <circle cx="0" cy="-9" r="3" fill="#ca8a04" />
          <circle cx="5" cy="-8" r="2.5" fill="#ca8a04" />
          <circle cx="0" cy="7" r="4" fill="none" stroke="#15803d" stroke-width="1" />
          <rect x="-8" y="11" width="16" height="3" fill="#ca8a04" rx="1" />
        </g>
        <!-- Ruled lines -->
        <line x1="15" y1="26" x2="95" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="15" y1="34" x2="95" y2="34" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="15" y1="42" x2="95" y2="42" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="15" y1="50" x2="80" y2="50" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- LAUREL LEAF BRANCHES ON LEFT & RIGHT -->
    <g id="laurelLeaves">
      <!-- Left Laurel Branch -->
      <g transform="translate(70, 270)">
        <path d="M 0 35 C 5 15, 20 0, 45 -15" stroke="#15803d" stroke-width="2.5" fill="none" />
        <path d="M 5 30 Q 0 20, 8 18 Q 12 25, 5 30 Z" fill="#16a34a" />
        <path d="M 14 20 Q 10 10, 20 10 Q 22 18, 14 20 Z" fill="#15803d" />
        <path d="M 26 10 Q 24 0, 34 2 Q 34 10, 26 10 Z" fill="#16a34a" />
        <path d="M 38 0 Q 40 -10, 48 -5 Q 46 2, 38 0 Z" fill="#15803d" />
      </g>
      <!-- Right Laurel Branch (Mirrored) -->
      <g transform="translate(430, 270) scale(-1, 1)">
        <path d="M 0 35 C 5 15, 20 0, 45 -15" stroke="#15803d" stroke-width="2.5" fill="none" />
        <path d="M 5 30 Q 0 20, 8 18 Q 12 25, 5 30 Z" fill="#16a34a" />
        <path d="M 14 20 Q 10 10, 20 10 Q 22 18, 14 20 Z" fill="#15803d" />
        <path d="M 26 10 Q 24 0, 34 2 Q 34 10, 26 10 Z" fill="#16a34a" />
        <path d="M 38 0 Q 40 -10, 48 -5 Q 46 2, 38 0 Z" fill="#15803d" />
      </g>
    </g>
  </g>

  <!-- TYPOGRAPHY: BHUBHARATHI LAND RECORDS MANAGEMENT SYSTEM -->
  <g id="typographySection" transform="translate(250, 420)">
    <!-- Primary Heading: BHUBHARATHI -->
    <text x="0" y="0" fill="#14532d" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="4">BHUBHARATHI</text>
    <!-- Subtitle: LAND RECORDS MANAGEMENT SYSTEM -->
    <text x="0" y="25" fill="#1e3a8a" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2.5">LAND RECORDS MANAGEMENT SYSTEM</text>
  </g>

  <!-- 3 BOTTOM FEATURE BADGES: TRANSPARENT | ACCURATE | ACCESSIBLE -->
  <g id="featureBadges" transform="translate(250, 480)">
    <!-- Dividing Line Above -->
    <line x1="-200" y1="-12" x2="200" y2="-12" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Badge 1: TRANSPARENT -->
    <g transform="translate(-130, 8)">
      <!-- Shield Check Icon -->
      <path d="M-12 -9 L-2 -9 C2 -9 3 -4 3 1 C3 6 -2 10 -7 12 C-12 10 -17 6 -17 1 C-17 -4 -16 -9 -12 -9 Z" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
      <path d="M-10 1 L-8 3 L-3 -2" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="8" y="4" font-family="system-ui" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="1">TRANSPARENT</text>
    </g>

    <!-- Divider 1 -->
    <line x1="-30" y1="-5" x2="-30" y2="18" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Badge 2: ACCURATE -->
    <g transform="translate(20, 8)">
      <!-- Crosshairs Target Icon -->
      <circle cx="-10" cy="0" r="7" fill="none" stroke="#15803d" stroke-width="2" />
      <circle cx="-10" cy="0" r="3" fill="#15803d" />
      <line x1="-10" y1="-10" x2="-10" y2="-7" stroke="#15803d" stroke-width="1.5" />
      <line x1="-10" y1="7" x2="-10" y2="10" stroke="#15803d" stroke-width="1.5" />
      <line x1="-20" y1="0" x2="-17" y2="0" stroke="#15803d" stroke-width="1.5" />
      <line x1="-3" y1="0" x2="0" y2="0" stroke="#15803d" stroke-width="1.5" />
      <text x="7" y="4" font-family="system-ui" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="1">ACCURATE</text>
    </g>

    <!-- Divider 2 -->
    <line x1="95" y1="-5" x2="95" y2="18" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Badge 3: ACCESSIBLE -->
    <g transform="translate(145, 8)">
      <!-- Person in Circle Icon -->
      <circle cx="-10" cy="0" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
      <circle cx="-10" cy="-3" r="2.5" fill="#15803d" />
      <path d="M-15 6 C-15 3, -5 3, -5 6" stroke="#15803d" stroke-width="1.5" fill="none" />
      <text x="6" y="4" font-family="system-ui" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="1">ACCESSIBLE</text>
    </g>
  </g>
</svg>
